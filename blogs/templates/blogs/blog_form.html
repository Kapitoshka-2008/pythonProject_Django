{% extends 'base.html' %}
{% block content %}
  <h1>{% if object %}Редактировать{% else %}Создать{% endif %} запись</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
  </form>
  <p><a href="{% url 'blogs:list' %}">К списку</a></p>
{% endblock %}
