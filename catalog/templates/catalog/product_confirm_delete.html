{% extends 'catalog/base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
  <h1 class="mb-4">Удалить товар</h1>
  <div class="alert alert-warning">
    Вы уверены, что хотите удалить товар «{{ object.name }}»?
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">Удалить</button>
      <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>
{% endblock %}
